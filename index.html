  <body bgcolor="Dark Green">
    <center>

    <hr />

    <!-- LAYOUT TABLE: puts the 3 sections side-by-side, 90's style -->
    <table
      border="0"
      cellpadding="10"
      cellspacing="0"
      align="center"
      width="100%"
    >
      <tr valign="top">
        <!-- SECTION 1: HTML table with info + link -->
        <td align="center">
          <table border="1" cellpadding="5" cellspacing="0" align="center">
            <tr>
              <th colspan="2">Gnome Information</th>
            </tr>
            <tr>
              <td>WoodTypes</td>
              <td>Oak & Birch</td>
            </tr>
            <tr>
              <td>Manufacturer</td>
              <td>GiantWood Co.</td>
            </tr>
            <tr>
              <td>Best Type of Wood</td>
              <td>Oak</td>
            </tr>
            <tr>
              <td>Scenery  Type</td>
              <td>Lush Lawns</td>
            </tr>
            <tr>
              <td colspan="2" align="center">
                <a href="https://en.wikipedia.org/wiki/Garden_gnome" target="_blank"
                  >Read more on Wikipedia</a
                >
              </td>
            </tr>
          </table>
        </td>

        <!-- SECTION 2: image, relative path -->
        <td align="center">
          <h2>Oak Gnome</h2>
          <img src="assets/img/woodGnome.avif" alt="Wood Gnome" width="300" />
        </td>

        <!-- SECTION 3: image, absolute path -->
        <td align="center">
          <h2>Birch Gnome</h2>
          <img
            src="https://i.pinimg.com/1200x/ed/df/47/eddf475781f603b70463e97a334e7431.jpg"

            width="300"
