  <body bgcolor="Dark Green">
    <center>
      <h1>WoodGnomes</h1>
      <p>The #1 Shop for Aesthetic Wood Gnomes!.</p>

    <hr />

    <!-- LAYOUT TABLE: puts the 3 sections side-by-side, 90's style -->
    <table
      border="0"
      cellpadding="10"
      cellspacing="0"
      align="center"
      width="100%"
    >
      <tr valign="top">
        <!-- SECTION 1: HTML table with info + link -->
        <td align="center">
          <table border="1" cellpadding="5" cellspacing="0" align="center">
            <tr>
              <th colspan="2">Garfield Facts</th>
            </tr>
            <tr>
              <td>WoodTypes</td>
              <td>Oak & Birch</td>
            </tr>
            <tr>
              <td>Manufacturer</td>
              <td>GiantWood Co.</td>
            </tr>
            <tr>
              <td>Best Type of Wood</td>
              <td>Oak</td>
            </tr>
            <tr>
              <td>Scenery  Type</td>
              <td>Lush Lawns</td>
            </tr>
            <tr>
              <td colspan="2" align="center">
                <a href="https://en.wikipedia.org/wiki/Garden_gnome" target="_blank"
                  >Read more on Wikipedia</a
                >
              </td>
            </tr>
          </table>
        </td>

        <!-- SECTION 2: image, relative path -->
        <td align="center">
          <h2>Garfield (relative path image)</h2>
          <img src="assets/img/garfield.jpg" alt="Garfield" width="300" />
        </td>

        <!-- SECTION 3: image, absolute path -->
        <td align="center">
          <h2>Garfield (absolute path image)</h2>
          <img
            src="/assets/img/garfield-2.jpg"
            alt="Garfield again"
            width="300"
          />
        </td>
      </tr>
